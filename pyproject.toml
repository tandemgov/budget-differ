[project]
name = "budget-differ"
version = "1.0.0"
description = "Diff year-over-year appropriations committee report language"
license = "CC0-1.0"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["rapidfuzz>=3.0"]

[project.scripts]
budget-differ = "budget_differ.build:main"

[dependency-groups]
dev = ["pytest>=8.0", "pymupdf>=1.24"]

[build-system]
requires = ["uv_build>=0.6.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
