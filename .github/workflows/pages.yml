name: Publish demo to GitHub Pages

# Publishes the committed demo/ plus the in-browser comparison runtime.
# demo/ itself is committed as built (rebuilding it needs the sibling report corpus: run `uv run budget-differ demo` locally and commit).
# The runtime (Pyodide, the PyMuPDF WebAssembly wheel, rapidfuzz's pure-Python modules) is fetched here, pinned by SHA-256 in
# src/budget_differ/compare_page.py, and checked in a browser before anything is published.
on:
  push:
    branches: [main]
    paths: ["demo/**", "web/**", "src/budget_differ/compare_page.py", "scripts/check_compare_page.cjs", ".github/workflows/pages.yml"]
  pull_request:
    paths: ["demo/**", "web/**", "src/**", "scripts/check_compare_page.cjs", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Fetch the comparison runtime (pinned, hash-checked)
        run: uv run budget-differ compare-page --runtime
      - name: Committed page matches the source
        run: git diff --exit-code -- demo/compare
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.63.0
          npx playwright install --with-deps chromium
      - name: Check the comparison page in a browser
        run: node scripts/check_compare_page.cjs
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: demo

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
